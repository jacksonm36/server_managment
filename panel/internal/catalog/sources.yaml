# PHP apps the panel pins itself ("Refresh catalog", weekly). For each one it
# finds the latest stable release, downloads it, records the sha256 and
# checks the archive is ready to run (index.php present; composer apps must
# ship vendor/). Apps that fail the check stay out of the store and are
# listed with the reason. Install = new site (+ database) + the verified
# release; the user finishes the app's own web installer.
#
# Only apps that keep their secrets in the database or in .php files are
# listed: nginx does not read .htaccess, so apps that rely on it to hide data
# files in the web root (PluXml, Grav, Kanboard, PrivateBin, FreshRSS,
# DokuWiki, WonderCMS...) need extra rules first.
#
# Fields: see Source in refresh.go. Exactly one of github / url (+ scrape).

