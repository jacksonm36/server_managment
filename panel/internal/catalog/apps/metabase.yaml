id: metabase
name: Metabase
category: Analytics
kind: compose
description: Business intelligence - ask questions of your databases and build dashboards without writing SQL.
version: "0.64.1"
needs_docker: true
min_ram_mb: 2048
protect: false
admin_path: /
homepage: https://www.metabase.com
notes: First start takes a minute or two. Finish the setup wizard right away to create the admin account.

compose: |
  services:
    metabase:
      image: metabase/metabase:v0.64.1
      restart: unless-stopped
      ports:
        - "127.0.0.1:${port}:3000"
      environment:
        MB_DB_FILE: /metabase-data/metabase.db
        MB_SITE_URL: "${site_url}/"
        MB_ANON_TRACKING_ENABLED: "false"
      volumes:
        - data:/metabase-data
  volumes:
    data: {}
