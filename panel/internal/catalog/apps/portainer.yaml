id: portainer
name: Portainer CE
category: Docker
kind: compose
description: Web UI to manage Docker containers, images, volumes, networks and stacks on this server.
version: "2.45.2"
needs_docker: true
min_ram_mb: 512
protect: true
admin_path: /
homepage: https://www.portainer.io
notes: Portainer controls Docker, which means root on this server, so the site is password-protected. Create the Portainer admin within 5 minutes of the install (otherwise restart it from the Docker tab).

compose: |
  services:
    portainer:
      image: portainer/portainer-ce:2.45.2
      restart: unless-stopped
      ports:
        - "127.0.0.1:${port}:9000"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - data:/data
  volumes:
    data: {}
