id: joomla
name: Joomla
category: CMS
description: Flexible open-source CMS for websites and portals. Installed with Joomla's command-line installer.
version: "5.4.9"
php_min: "8.1"
database: true
admin: true
admin_path: /administrator/
homepage: https://www.joomla.org

install:
  - fetch:
      url: https://github.com/joomla/joomla-cms/releases/download/5.4.9/Joomla_5.4.9-Stable-Full_Package.tar.gz
      sha256: 8c658d16b6e908f8cfce3556ac7280fe210c4ebd916202f406fe6bf1b5b05149
      strip: 0
      into: public
  - php:
      - installation/joomla.php
      - install
      - "--site-name=${title}"
      - "--admin-user=${admin_user}"
      - "--admin-username=${admin_user}"
      - "--admin-password=${admin_password}"
      - "--admin-email=${admin_email}"
      - --db-type=mysqli
      - --db-host=localhost
      - "--db-user=${db_user}"
      - "--db-pass=${db_password}"
      - "--db-name=${db_name}"
      - --db-prefix=jos_
      - --db-encryption=0
      - --no-interaction
  - remove: public/installation

version_check:
  - php: [-r, "define('_JEXEC', 1); require 'libraries/src/Version.php'; echo Joomla\\CMS\\Version::MAJOR_VERSION . '.' . Joomla\\CMS\\Version::MINOR_VERSION . '.' . Joomla\\CMS\\Version::PATCH_VERSION;"]
