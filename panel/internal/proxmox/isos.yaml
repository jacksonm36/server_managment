# Installer and tool ISOs servermgr can download straight into a Proxmox
# storage (download-url), like an os.click for the cluster. Every entry
# points at the vendor's own server.
#
# An entry either names a fixed url, or a dir plus a match pattern: the
# newest file name matching it is picked from the vendor's checksum file
# (checksums) or, with list: dir, from the directory listing. Proxmox
# verifies the download against the hash from the checksum file, or from
# the file's own url + checksum_suffix. Entries without either say so in
# the UI.
#
# category: linux, hypervisor, tools
# icon: a logo hint for the UI (distro or vendor name)

- id: debian-netinst
  name: Debian stable (netinst)
  vendor: Debian
  category: linux
  icon: debian
  dir: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/
  match: ^debian-\d+\.\d+\.\d+-amd64-netinst\.iso$
  checksums: SHA512SUMS
- id: debian-dvd
  name: Debian stable (DVD 1)
  vendor: Debian
  category: linux
  icon: debian
  dir: https://cdimage.debian.org/debian-cd/current/amd64/iso-dvd/
  match: ^debian-\d+\.\d+\.\d+-amd64-DVD-1\.iso$
  checksums: SHA512SUMS
