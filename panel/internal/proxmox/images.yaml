# Official cloud images servermgr can turn into Proxmox VM templates.
# Each entry points at the vendor's own "latest" download for x86_64 and,
# where the vendor publishes one, its checksum file. Proxmox downloads
# the image itself (download-url) and verifies the checksum.
#
# user: the account the image's cloud-init creates by default.
