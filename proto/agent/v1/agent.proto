syntax = "proto3";

package agent.v1;

option go_package = "github.com/jacksonm36/servermgr/gen/agent/v1;agentv1";

// AgentService is served by the panel. Agents dial out to the panel over mTLS
// and keep a single bidirectional stream open for their lifetime.
service AgentService {
  rpc Connect(stream AgentMessage) returns (stream PanelMessage);
}

// ---- agent -> panel ----

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    Metrics metrics = 2;
    JobUpdate job_update = 3;
  }
}

// Hello must be the first message on every stream.
message Hello {
  string hostname = 1;
  string os = 2;          // e.g. "debian"
  string os_version = 3;  // e.g. "13 (trixie)"
  string os_pretty = 4;
  string kernel = 5;
  string arch = 6;
  string agent_version = 7;
  uint32 cpu_count = 8;
}

message Metrics {
  int64 ts_unix_ms = 1;
  double cpu_percent = 2;
  uint64 mem_total_bytes = 3;
  uint64 mem_used_bytes = 4;
  uint64 disk_total_bytes = 5;
  uint64 disk_used_bytes = 6;
  double load1 = 7;
  double load5 = 8;
  double load15 = 9;
  uint64 uptime_seconds = 10;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_RUNNING = 1;
  JOB_STATUS_SUCCEEDED = 2;
  JOB_STATUS_FAILED = 3;
}

message JobUpdate {
  string job_id = 1;
  JobStatus status = 2;
  repeated string log_lines = 3;
  // JSON-encoded result, set when status is SUCCEEDED.
  string result_json = 4;
  string error = 5;
}

// ---- panel -> agent ----

message PanelMessage {
  oneof msg {
    Job job = 1;
  }
}

enum Op {
  OP_UNSPECIFIED = 0;
  OP_SYSTEM_INFO = 1;
  OP_PACKAGES_CHECK_UPDATES = 2;
  OP_PACKAGES_UPGRADE = 3;      // params: packages (space-separated, optional), dist, autoremove
  OP_SYSTEM_REBOOT = 4;
  OP_SSH_KEYS_LIST = 5;         // params: user
  OP_SSH_KEY_ADD = 6;           // params: user, key, comment
  OP_SSH_KEY_REMOVE = 7;        // params: user, fingerprint
  OP_FIREWALL_STATUS = 8;
  OP_FIREWALL_INSTALL = 9;
  OP_FIREWALL_ENABLE = 10;
  OP_FIREWALL_DISABLE = 11;
  OP_FIREWALL_RULE_ADD = 12;    // params: action, port, proto, from, comment
  OP_FIREWALL_RULE_DELETE = 13; // params: num
  OP_FAIL2BAN_STATUS = 14;
  OP_FAIL2BAN_INSTALL = 15;
  OP_FAIL2BAN_CONFIGURE = 16;   // params: bantime, findtime, maxretry, ignoreip
  OP_FAIL2BAN_BAN = 17;         // params: jail, ip
  OP_FAIL2BAN_UNBAN = 18;       // params: jail, ip
  OP_WEB_STATUS = 19;
  OP_WEB_INSTALL = 20;          // params: php (version, optional)
  OP_PHP_INSTALL = 21;          // params: version
  OP_SITE_CREATE = 22;          // params: domain, aliases, type, php_version, proxy_target
  OP_SITE_UPDATE = 23;          // params: domain, aliases, type, php_version, proxy_target, force_https
  OP_SITE_DELETE = 24;          // params: domain, delete_files
  OP_SITE_TLS = 25;             // params: domain, mode (off|selfsigned|letsencrypt), email, staging
  OP_DB_STATUS = 26;
  OP_DB_INSTALL = 27;
  OP_DB_CREATE = 28;            // params: name, user, host, password
  OP_DB_DELETE = 29;            // params: name, drop_users
  OP_DB_USER_SAVE = 30;         // params: user, host, password, databases
  OP_DB_USER_DELETE = 31;       // params: user, host
}

message Job {
  string id = 1;
  Op op = 2;
  map<string, string> params = 3;
}
