syntax = "proto3";

package agent.v1;

option go_package = "github.com/jacksonm36/servermgr/gen/agent/v1;agentv1";

// AgentService is served by the panel. Agents dial out to the panel over mTLS
// and keep a single bidirectional stream open for their lifetime.
service AgentService {
  rpc Connect(stream AgentMessage) returns (stream PanelMessage);
}

// ---- agent -> panel ----

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    Metrics metrics = 2;
    JobUpdate job_update = 3;
    TerminalOutput terminal_output = 4;
    TerminalExit terminal_exit = 5;
  }
}

// ---- web terminal ----

message TerminalOutput {
  string session_id = 1;
  bytes data = 2;
}

message TerminalExit {
  string session_id = 1;
  int32 code = 2;
  string error = 3;
}

message TerminalOpen {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message TerminalInput {
  string session_id = 1;
  bytes data = 2;
}

message TerminalResize {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message TerminalClose {
  string session_id = 1;
}

// Hello must be the first message on every stream.
message Hello {
  string hostname = 1;
  string os = 2;          // e.g. "debian"
  string os_version = 3;  // e.g. "13 (trixie)"
  string os_pretty = 4;
  string kernel = 5;
  string arch = 6;
  string agent_version = 7;
  uint32 cpu_count = 8;
}

message Metrics {
  int64 ts_unix_ms = 1;
  double cpu_percent = 2;
  uint64 mem_total_bytes = 3;
  uint64 mem_used_bytes = 4;
  uint64 disk_total_bytes = 5;
  uint64 disk_used_bytes = 6;
  double load1 = 7;
  double load5 = 8;
  double load15 = 9;
  uint64 uptime_seconds = 10;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_RUNNING = 1;
  JOB_STATUS_SUCCEEDED = 2;
  JOB_STATUS_FAILED = 3;
}

message JobUpdate {
  string job_id = 1;
  JobStatus status = 2;
  repeated string log_lines = 3;
  // JSON-encoded result, set when status is SUCCEEDED.
  string result_json = 4;
  string error = 5;
}

// ---- panel -> agent ----

message PanelMessage {
  oneof msg {
    Job job = 1;
    TerminalOpen terminal_open = 2;
    TerminalInput terminal_input = 3;
    TerminalResize terminal_resize = 4;
    TerminalClose terminal_close = 5;
  }
}

enum Op {
  OP_UNSPECIFIED = 0;
  OP_SYSTEM_INFO = 1;
  OP_PACKAGES_CHECK_UPDATES = 2;
  OP_PACKAGES_UPGRADE = 3;      // params: packages (space-separated, optional), dist, autoremove
  OP_SYSTEM_REBOOT = 4;
  OP_SSH_KEYS_LIST = 5;         // params: user
  OP_SSH_KEY_ADD = 6;           // params: user, key, comment
  OP_SSH_KEY_REMOVE = 7;        // params: user, fingerprint
  OP_FIREWALL_STATUS = 8;
  OP_FIREWALL_INSTALL = 9;
  OP_FIREWALL_ENABLE = 10;
  OP_FIREWALL_DISABLE = 11;
  OP_FIREWALL_RULE_ADD = 12;    // params: action, port, proto, from, comment
  OP_FIREWALL_RULE_DELETE = 13; // params: num
  OP_FAIL2BAN_STATUS = 14;
  OP_FAIL2BAN_INSTALL = 15;
  OP_FAIL2BAN_CONFIGURE = 16;   // params: bantime, findtime, maxretry, ignoreip
  OP_FAIL2BAN_BAN = 17;         // params: jail, ip
  OP_FAIL2BAN_UNBAN = 18;       // params: jail, ip
  OP_WEB_STATUS = 19;
  OP_WEB_INSTALL = 20;          // params: php (version, optional)
  OP_PHP_INSTALL = 21;          // params: version
  OP_SITE_CREATE = 22;          // params: domain, aliases, type, php_version, proxy_target
  OP_SITE_UPDATE = 23;          // params: domain, aliases, type, php_version, proxy_target, force_https
  OP_SITE_DELETE = 24;          // params: domain, delete_files
  OP_SITE_TLS = 25;             // params: domain, mode (off|selfsigned|letsencrypt), email, staging
  OP_DB_STATUS = 26;
  OP_DB_INSTALL = 27;
  OP_DB_CREATE = 28;            // params: name, user, host, password
  OP_DB_DELETE = 29;            // params: name, drop_users
  OP_DB_USER_SAVE = 30;         // params: user, host, password, databases
  OP_DB_USER_DELETE = 31;       // params: user, host
  OP_FILES_LIST = 32;           // params: path
  OP_FILES_READ = 33;           // params: path
  OP_FILES_WRITE = 34;          // params: path, content | content_b64, overwrite
  OP_FILES_MKDIR = 35;          // params: path
  OP_FILES_DELETE = 36;         // params: path
  OP_FILES_RENAME = 37;         // params: from, to
  OP_FILES_CHMOD = 38;          // params: path, mode
  OP_CRON_LIST = 39;
  OP_CRON_SAVE = 40;            // params: id (empty = new), schedule, user, command, comment, enabled
  OP_CRON_DELETE = 41;          // params: id
  OP_CRON_RUN = 42;             // params: id
  OP_BACKUP_LIST = 43;
  OP_BACKUP_CREATE = 44;        // params: domain, databases
  OP_BACKUP_DELETE = 45;        // params: domain, file
  OP_BACKUP_RESTORE = 46;       // params: domain, file, files, databases
  OP_BACKUP_POLICY = 47;        // params: domain, enabled, every, hour, keep, databases
  OP_SERVICES_LIST = 48;
  OP_SERVICE_ACTION = 49;       // params: name, action
  OP_LOGS_READ = 50;            // params: source (journal|file|files), unit, priority, since, grep, path, lines
  OP_DOCKER_STATUS = 51;
  OP_DOCKER_INSTALL = 52;
  OP_DOCKER_CONTAINER = 53;     // params: id, action (start|stop|restart|kill|remove)
  OP_DOCKER_LOGS = 54;          // params: id, lines
  OP_DOCKER_IMAGE_REMOVE = 55;  // params: id
  OP_DOCKER_PRUNE = 56;
  OP_COMPOSE_READ = 57;         // params: name
  OP_COMPOSE_SAVE = 58;         // params: name, yaml, deploy
  OP_COMPOSE_ACTION = 59;       // params: name, action (up|down|restart|pull|delete)
  OP_AGENT_UPDATE = 60;         // params: sha256, version, current
  OP_APP_DEPLOY = 61;           // params: domain, app, name, version, steps, version_steps, vars
  OP_APP_UPDATE = 62;           // params: domain, steps, version_steps, vars
  OP_SITE_ACCESS = 63;          // params: domain, auth (on|off), auth_user, auth_password, allow_ips
  OP_CROWDSEC_STATUS = 64;
  OP_CROWDSEC_INSTALL = 65;     // params: lapi_url, machine, password, bouncer_key
  OP_CROWDSEC_HUB = 66;         // params: action (install|remove), items
  OP_CROWDSEC_REMOVE = 67;
  OP_ANSIBLE_PREPARE = 68;      // params: pubkey, from
  OP_ANSIBLE_REVOKE = 69;
  // Windows servers
  OP_WIN_APPS_LIST = 70;        // installed programs
  OP_WIN_APPS_INSTALL = 71;     // params: apps (JSON: resolved catalog entries from the panel)
  OP_WIN_APP_UNINSTALL = 72;    // params: id (the program's uninstall registry key)
  // ZFS (Linux)
  OP_ZFS_STATUS = 73;           // pools (vdev tree, scan), datasets, importable pools, ARC
  OP_ZFS_POOL = 74;             // params: action (scrub|scrub_pause|scrub_stop|trim|clear|upgrade|export|import), pool
  OP_ZFS_DEVICE = 75;           // params: action (add|attach|detach|replace|offline|online|remove), pool, device, new_device, vdev, devices
  OP_ZFS_DATASET = 76;          // params: action (create|destroy|set|inherit|rename), name, type, size, props, new_name, recursive
  OP_ZFS_SNAPSHOTS = 77;        // params: dataset (optional)
  OP_ZFS_SNAPSHOT = 78;         // params: action (create|destroy|rollback|clone), name, recursive, target
  OP_ZFS_POOL_CREATE = 79;      // params: name, vdev, devices, ashift, compression
  OP_ZFS_POOL_DESTROY = 80;     // params: name, confirm
  OP_ZFS_SNAP_POLICY = 81;      // params: dataset, schedule (hourly|daily|weekly|monthly), keep, recursive, delete
  OP_ZFS_REPL_KEY = 82;         // the source's replication public key (created on first use)
  OP_ZFS_REPL_AUTHORIZE = 83;   // on the target: params public_key, parent, from, revoke
  OP_ZFS_REPL_POLICY = 84;      // on the source: params dataset, target_host, target_port, target_parent, host_keys, schedule, keep, delete
  OP_ZFS_REPL_RUN = 85;         // params dataset, target_host
}

message Job {
  string id = 1;
  Op op = 2;
  map<string, string> params = 3;
}
